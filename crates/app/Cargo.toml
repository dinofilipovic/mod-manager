[package]
name = "mm-app"
description = "Desktop app: thin Tauri layer over mm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
ts-rs.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }
