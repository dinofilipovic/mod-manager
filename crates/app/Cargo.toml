[package]
name = "mm-app"
description = "Desktop app: thin Tauri layer over mm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64 = "0.23.1"
mm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-updater = "2.14.0"
ts-rs.workspace = true
uuid = { version = "1.29.0", features = ["v4"] }

# tauri-plugin-deep-link 2.6.2 doesn't compile against rust-ini 0.21.2+, which
# added required fields to `ParseOption`. Hold rust-ini back until the plugin
# is updated.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
