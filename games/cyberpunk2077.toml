# Cyberpunk 2077 game definition.
#
# Everything game-specific lives here, not in code. Paths in `known_install_paths`
# are Windows paths and get resolved inside each environment (bottle/prefix).

id = "cyberpunk2077"
name = "Cyberpunk 2077"
# Relative to the install folder; used to confirm a folder really is the game.
executable = "bin/x64/Cyberpunk2077.exe"

# Fallback locations checked when no store metadata points at the game.
known_install_paths = [
  'C:\GOG Games\Cyberpunk 2077',
  'C:\Program Files (x86)\GOG Galaxy\Games\Cyberpunk 2077',
  'C:\Program Files\Epic Games\Cyberpunk2077',
  'C:\Program Files\Epic Games\Cyberpunk 2077',
]

# Folder names the game expects in lowercase. Mods packed on Windows often use
# other casing, which breaks on case-sensitive filesystems (Linux, some bottles).
canonical_dirs = [
  "archive", "pc", "mod", "bin", "x64", "plugins", "cyber_engine_tweaks", "mods",
  "r6", "scripts", "tweaks", "red4ext", "engine", "config", "tools", "redmod",
]

# Top-level folders of the game. An archive containing any of these is laid out
# from the game root and installed as-is.
root_markers = ["archive", "bin", "r6", "red4ext", "mods", "engine", "tools"]

# Where the game keeps saves. `*` is the Windows user (`crossover` in CrossOver).
saves = 'C:\users\*\Saved Games\CD Projekt Red\Cyberpunk 2077'

# Top-level keys must come before the first [table] below, or TOML puts them
# inside that table.
[stores]
steam_app_id = "1091500"
gog_id = "1423049311"
nexus_domain = "cyberpunk2077"

# Where each kind of mod file is deployed, relative to the install folder.
[[layout]]
kind = "archive"
path = "archive/pc/mod"
extensions = ["archive", "xl"]
flatten = true
description = "Archive mods (.archive) and ArchiveXL definitions (.xl)"
# .archive layout from WolvenKit (WolvenKit.RED4/Archive/IO/ArchiveReader.cs),
# checked against the game's own archives; ArchiveXL .xl files are YAML.
checks = [
  { checker = "archive_header", extensions = ["archive"] },
  { checker = "yaml", extensions = ["xl"] },
]

[[layout]]
kind = "redscript"
path = "r6/scripts"
extensions = ["reds"]
per_mod_folder = true
description = "redscript mods"

[[layout]]
kind = "tweak"
path = "r6/tweaks"
extensions = ["yaml", "yml", "tweak"]
per_mod_folder = true
description = "TweakXL tweaks"
checks = [{ checker = "yaml", extensions = ["yaml", "yml"] }]

[[layout]]
kind = "cet"
path = "bin/x64/plugins/cyber_engine_tweaks/mods"
marker_file = "init.lua"
description = "Cyber Engine Tweaks Lua mods"
# CET loads mods/<name>/init.lua (ScriptStore.cpp: "Ignoring mod which does
# not contain init.lua").
# Their JSON files are usually settings the mod rewrites: worth a warning only.
checks = [{ checker = "lua_entry" }, { checker = "json", extensions = ["json"], warning_only = true }]

[[layout]]
kind = "red4ext"
path = "red4ext/plugins"
extensions = ["dll"]
per_mod_folder = true
description = "RED4ext plugins"
# The game is 64-bit, so RED4ext can only load 64-bit DLLs.
checks = [{ checker = "pe64_dll", extensions = ["dll"] }]

# The script extenders' own folders, so they are recognised by type. They have
# no extensions or marker, so loose files are never routed here.
[[layout]]
kind = "cet"
path = "bin/x64/plugins/cyber_engine_tweaks"
description = "Cyber Engine Tweaks itself"

[[layout]]
kind = "red4ext"
path = "red4ext"
description = "RED4ext itself"

[[layout]]
kind = "redmod"
path = "mods"
marker_file = "info.json"
description = "REDmod mods (mods/<name>/info.json), need the -modded launch argument"
checks = [{ checker = "json", extensions = ["json"] }]

# DLL loaders that Wine must load from the game folder instead of its built-ins.
[[wine.dll_overrides]]
dll = "version"
mode = "native,builtin"
reason = "Cyber Engine Tweaks loads through version.dll"

[[wine.dll_overrides]]
dll = "winmm"
mode = "native,builtin"
reason = "RED4ext loads through winmm.dll"

[launch]
modded_args = ["-modded"]

# Frameworks other mods build on. `provides` are files that prove it is
# installed; `requires` lists frameworks it needs itself.
#
# `min_versions`: from game version `game` (the executable's product version,
# compared as a decimal: 2.31 is before 2.5) on, the framework needs at least
# `version`. Only values a release note states; patches without a cited
# minimum are left out.
[[frameworks]]
id = "cet"
name = "Cyber Engine Tweaks"
nexus_mod_id = 107
provides = ["bin/x64/plugins/cyber_engine_tweaks.asi"]
# CET 1.38.0 release notes (github.com/maximegmd/CyberEngineTweaks, 2026-10-22):
# "Supports Cyberpunk 2077 patch 2.5 ... Earlier patches are no longer supported."
min_versions = [{ game = "2.5", version = "1.38.0" }]

[[frameworks]]
id = "red4ext"
name = "RED4ext"
nexus_mod_id = 2380
provides = ["red4ext/RED4ext.dll"]
# No minimum for patch 2.5: RED4ext 1.29.0 claims support for "patch 2.31 and
# newer" and 1.31.0 only raises its own minimum to 2.5.

[[frameworks]]
id = "redscript"
name = "redscript"
nexus_mod_id = 1511
provides = ["engine/tools/scc.exe"]
# redscript 0.5.32 release notes (github.com/jac3km4/redscript, 2026-10-22):
# "fix: support script bundles from game patch 2.5".
min_versions = [{ game = "2.5", version = "0.5.32" }]

[[frameworks]]
id = "archivexl"
name = "ArchiveXL"
nexus_mod_id = 4198
provides = ["red4ext/plugins/ArchiveXL/ArchiveXL.dll"]
requires = ["red4ext"]
# ArchiveXL 1.28.0 release notes (github.com/psiberx/cp2077-archive-xl,
# 2026-10-25): "Updated compatibility to game patch 2.5".
min_versions = [{ game = "2.5", version = "1.28.0" }]

[[frameworks]]
id = "tweakxl"
name = "TweakXL"
nexus_mod_id = 4197
provides = ["red4ext/plugins/TweakXL/TweakXL.dll"]
requires = ["red4ext"]
# TweakXL 1.12.0 release notes (github.com/psiberx/cp2077-tweak-xl,
# 2026-10-25): "Updated compatibility to game patch 2.5".
min_versions = [{ game = "2.5", version = "1.12.0" }]

[[frameworks]]
id = "codeware"
name = "Codeware"
nexus_mod_id = 7780
provides = ["red4ext/plugins/Codeware/Codeware.dll"]
requires = ["red4ext"]
# Codeware 1.21.0 release notes (github.com/psiberx/cp2077-codeware,
# 2026-10-25): "Updated compatibility to game patch 2.5".
min_versions = [{ game = "2.5", version = "1.21.0" }]

# Libraries many mods require. Ids, requirements and files from Nexus Mods
# (v2 API `legacyModsByDomain` and the files' content previews, 2026-10-25).
[[frameworks]]
id = "mod_settings"
name = "Mod Settings"
nexus_mod_id = 4885
# Mod Settings 0.2.21: red4ext/plugins/mod_settings/{mod_settings.dll,
# ModSettings.archive, module.reds, ...}; requires RED4ext, redscript, ArchiveXL.
provides = ["red4ext/plugins/mod_settings/mod_settings.dll"]
requires = ["red4ext", "redscript", "archivexl"]

[[frameworks]]
id = "native_settings"
name = "Native Settings UI"
nexus_mod_id = 3518
# Native Settings UI 1.96 (the 1.97 preview isn't published): a CET mod in
# bin/x64/plugins/cyber_engine_tweaks/mods/nativeSettings; requires CET.
provides = ["bin/x64/plugins/cyber_engine_tweaks/mods/nativeSettings/init.lua"]
requires = ["cet"]

[[frameworks]]
id = "input_loader"
name = "Input Loader"
nexus_mod_id = 4575
# Input Loader 0.2.3: red4ext/plugins/input_loader/input_loader.dll and
# engine/config/platform/pc/input_loader.ini; requires RED4ext.
provides = ["red4ext/plugins/input_loader/input_loader.dll"]
requires = ["red4ext"]

# Which mod files need which framework: by extension, or by folder.
[[requirements]]
framework = "redscript"
extensions = ["reds"]

[[requirements]]
framework = "cet"
paths = ["bin/x64/plugins/cyber_engine_tweaks/mods"]

[[requirements]]
framework = "archivexl"
extensions = ["xl"]

[[requirements]]
framework = "tweakxl"
paths = ["r6/tweaks"]

[[requirements]]
framework = "red4ext"
paths = ["red4ext/plugins"]

# Log files the game and frameworks write, relative to the install folder.
# `*` matches within one path component. Source: RED Modding wiki,
# "Finding and reading log files".
#
# `status` says how a log confirms that mods of one kind loaded; patterns use
# `{name}` for the mod's folder and `^` for a line start.

# redscript 0.5.32 (scc/lib/src/lib.rs, compiler/src/source_map.rs): lists the
# compiled files one per line under "Compiling files in <r6\scripts>:", then
# logs "Compilation complete" when it worked.
[[logs]]
name = "redscript"
framework = "redscript"
path = "r6/logs/redscript_rCURRENT.log"
status = { kind = "redscript", loaded = "^{name}\\", needs = "Compilation complete" }

# RED4ext (src/dll/App.cpp, Systems/PluginSystem.cpp): one log per start,
# red4ext-<date>-<time>.log; "<plugin> (version: ..., author(s): ...) has
# been loaded", or "Could not load plugin '<file name>'".
[[logs]]
name = "RED4ext"
framework = "red4ext"
path = "red4ext/logs/red4ext-*.log"
status = { kind = "red4ext", loaded = "] {name} (version: ", failed = "Could not load plugin '{name}'" }

[[logs]]
name = "ArchiveXL"
framework = "archivexl"
path = "red4ext/plugins/ArchiveXL/ArchiveXL.log"

[[logs]]
name = "TweakXL"
framework = "tweakxl"
path = "red4ext/plugins/TweakXL/TweakXL.log"

[[logs]]
name = "Codeware"
framework = "codeware"
path = "red4ext/plugins/Codeware/Codeware.log"

[[logs]]
name = "Cyber Engine Tweaks"
framework = "cet"
path = "bin/x64/plugins/cyber_engine_tweaks/cyber_engine_tweaks.log"

# CET (src/scripting/Scripting.cpp, ScriptStore.cpp): mods are reported in
# scripting.log as "Mod <folder> loaded!" or "Mod <folder> failed to load!".
# CET writes info lines when the game closes or a warning comes.
[[logs]]
name = "CET scripts"
framework = "cet"
path = "bin/x64/plugins/cyber_engine_tweaks/scripting.log"
status = { kind = "cet", loaded = "Mod {name} loaded!", failed = "Mod {name} failed to load!" }

[[logs]]
name = "CET mod"
path = "bin/x64/plugins/cyber_engine_tweaks/mods/*/*.log"

[[logs]]
name = "REDmod"
path = "tools/redmod/bin/REDmodLog.txt"

# Optional archive load order. The game loads archives in archive/pc/mod by
# file name (first loaded wins). If this file exists, it uses the file's order
# instead. Off unless the user turns it on: the modding community recommends
# renaming files over a modlist.
[load_order]
file = "archive/pc/mod/modlist.txt"
extensions = ["archive"]
